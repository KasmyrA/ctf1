services:
  ollama:
    # Use ollama/ollama:rocm for AMD GPU acceleration.
    # Use ollama/ollama:cuda for NVIDIA GPU acceleration.
    # Fall back to ollama/ollama:latest for CPU-only.
    image: ollama/ollama:latest 
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5

  model-pull:
    image: ollama/ollama:latest
    container_name: ctf-model-pull
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    restart: "no"
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        model="$${CHAT_MODEL:-gemma4:e2b}"
        if ollama list | awk 'NR > 1 {print $$1}' | grep -Fxq "$$model"; then
          echo "Model $$model is already present"
        else
          ollama pull "$$model"
        fi

  backend:
    build: .
    container_name: ctf-backend
    environment:
      OLLAMA_URL: "http://ollama:11434"
      CHAT_MODEL: "gemma4:e2b"    # swap for any instruct model you like
      # GUARD_MODEL: "granite4.1-guardian:8b" #nessesery for server2.js
      MAX_PROMPT_LENGTH: "4000"
      # SECRET_FLAG is injected here instead of hard-coded in the source
      SECRET_FLAG: "FLAG{welcome_to_the_prompt_world}"
    depends_on:
      model-pull:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    expose:
      - "8787"

  frontend:
    image: nginx:alpine
    container_name: ctf-frontend
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - internal
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  internal:
