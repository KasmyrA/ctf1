version: "3.9"

services:
  ollama:
    # Use ollama/ollama:rocm for AMD GPU (Ryzen AI 395) acceleration.
    # Fall back to ollama/ollama:latest for CPU-only.
    image: ollama/ollama:rocm
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    devices:
      - /dev/kfd
      - /dev/dri
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ctf-backend
    environment:
      OLLAMA_URL: "http://ollama:11434"
      CHAT_MODEL: "granite3.1-dense:8b"     # swap for any instruct model you like
      GUARD_MODEL: "granite4.1-guardian:8b"
      MAX_PROMPT_LENGTH: "4000"
      # SECRET_FLAG is injected here instead of hard-coded in the source
      SECRET_FLAG: "FLAG{welcome_to_the_prompt_world}"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    expose:
      - "8787"

  frontend:
    image: nginx:alpine
    container_name: ctf-frontend
    volumes:
      - ./frontend/html:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - internal
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  internal:
