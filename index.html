<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    h1 { font-size: 1.4rem; color: #333; }

    textarea {
      width: 100%;
      height: 120px;
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
    }

    button {
      align-self: flex-end;
      padding: 0.6rem 1.4rem;
      font-size: 1rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    pre {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 1rem;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 60px;
      font-size: 0.95rem;
      color: #222;
    }

    .error { color: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Zdobądź mój sekret</h1>
    <textarea id="prompt" placeholder="Wpisz zapytanie..."></textarea>
    <button id="btn" onclick="send()">Wyślij</button>
    <pre id="output"></pre>
  </div>

  <script>
    const WORKER_URL = "https://llm-proxy.onekacpersmyrak.workers.dev/";

    async function send() {
      const prompt = document.getElementById("prompt").value.trim();
      if (!prompt) return;

      const btn = document.getElementById("btn");
      const output = document.getElementById("output");

      btn.disabled = true;
      output.textContent = "Ładowanie...";
      output.className = "";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        });

        const data = await response.json();

        if (!response.ok) {
          output.textContent = `Błąd ${response.status}: ${data.error ?? "Nieznany błąd"}`;
          output.className = "error";
        } else {
          output.textContent = data.response;
        }
      } catch (err) {
        output.textContent = `Błąd sieci: ${err.message}`;
        output.className = "error";
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("prompt").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send();
    });
  </script>
</body>
</html>
